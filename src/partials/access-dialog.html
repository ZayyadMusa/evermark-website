<dialog id="access-dialog" aria-labelledby="request-access-title"><div class="dialog-head"><span class="mini-wordmark">Let’s keep in touch.</span><button type="button" class="close-dialog" data-close-dialog aria-label="Close access request"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div><div class="dialog-body"><h2 id="request-access-title" class="dialog-heading">Request access.</h2><p class="dialog-intro">Save your interest in official filing or automated monitoring. These services are not activated for this workspace yet.</p><form id="request-access-form" novalidate><div class="field"><label for="request-email">Email address</label><input type="email" id="request-email" maxlength="254" required autocomplete="email" placeholder="you@yourbrand.com"></div><div class="field"><label for="request-interest">Area of interest</label><select id="request-interest"><option value="general">Evermark</option><option value="filing">Official filing</option><option value="monitoring">Automated monitoring</option></select></div><label class="consent-label"><input type="checkbox" id="request-consent" required><span>Save this request and email to my account.</span></label><p class="field-error" id="request-status" role="status"></p><a id="request-signin" class="button button-green" href="/signin?return_to=%2F" target="_top" hidden>Sign in to save your request</a><button class="button button-green" type="submit" id="request-submit">Send access request</button></form></div></dialog>
