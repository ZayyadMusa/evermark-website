<dialog id="add-link-dialog" aria-labelledby="add-link-title"><div class="dialog-head"><span class="mini-wordmark">Keep the evidence</span><button type="button" class="close-dialog" data-close-dialog aria-label="Close add link"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div><div class="dialog-body"><h2 class="dialog-heading" id="add-link-title">Save a link for review.</h2><form id="add-link-form" novalidate><div class="field"><label for="link-title">A name for this link</label><input id="link-title" maxlength="120" required placeholder="A listing, profile or website"></div><div class="field"><label for="link-url">Website address</label><input id="link-url" type="url" maxlength="2048" required placeholder="https://" inputmode="url"></div><div class="field"><label for="link-channel">Where did you find it?</label><select id="link-channel"><option value="marketplace">Marketplace</option><option value="social">Social profile</option><option value="domain">Domain or website</option><option value="other">Another source</option></select></div><div class="field"><label for="link-note">What should be reviewed? <span class="small-note">Optional</span></label><textarea id="link-note" rows="3" maxlength="1000" placeholder="Keep the context with the link."></textarea></div><p id="link-error" class="field-error" role="alert"></p><div class="dialog-actions"><button type="button" class="back-button" data-close-dialog>Cancel</button><button type="submit" id="save-link" class="button button-green">Save this link</button></div></form></div></dialog>
<dialog id="match-dialog" aria-labelledby="match-dialog-title"><div class="dialog-head"><span class="mini-wordmark">Review record</span><button type="button" class="close-dialog" data-close-dialog aria-label="Close review"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></button></div><div class="dialog-body"><h2 class="dialog-heading" id="match-dialog-title">Your saved link</h2><div id="match-evidence"></div><p class="field-error" id="review-error" role="alert"></p><div class="review-record-actions"><button type="button" class="button button-green" id="mark-reviewed">Mark reviewed</button><button type="button" class="button button-outline" id="archive-link">Archive link</button><button type="button" class="text-link inline-link" id="download-review">Download review record</button><button type="button" class="text-link inline-link" id="delete-link">Delete link</button></div><p class="dialog-disclosure">These are your saved notes and decisions. No infringement finding or legal notice is created.</p></div></dialog>
